[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-platform-mcp"
version = "0.1.0"
description = "Developer-facing toolkit for inspecting, replicating and validating AWS Glue data jobs, exposed to AI agents through an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Data Platform Team" }]
keywords = ["aws", "glue", "mcp", "data-platform", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.optional-dependencies]
# MCP server is a DEV-ONLY concern. It is never imported by a Glue job at
# runtime, so fastmcp must stay out of the main dependency set.
mcp = ["fastmcp>=2.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[glue,sts]>=1.34",
]

# Single console command, named like the package. Subcommands: init / list /
# serve. `serve` starts the MCP server (the same entry .mcp.json invokes). The
# short `data-platform` alias points at the same dispatcher.
[project.scripts]
data-platform-mcp = "dataplatform.cli:main"
data-platform = "dataplatform.cli:main"

[project.urls]
Repository = "https://github.com/rc301/data-platform-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/dataplatform"]

[tool.hatch.build.targets.wheel.force-include]
"src/dataplatform/templates" = "dataplatform/templates"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dataplatform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
